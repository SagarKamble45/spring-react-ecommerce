spring.application.name=sb-ecom

# ⚙️ JPA / Hibernate Configuration

# Auto create/update tables based on your entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (useful for debugging)
spring.jpa.show-sql=true
# Format the SQL output nicely
spring.jpa.properties.hibernate.format_sql=true

# Dialect tells Hibernate which SQL syntax to use
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


